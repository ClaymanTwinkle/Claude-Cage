name: Reusable Android and iPhone builds
on:
  workflow_call:
    inputs:
      ref:
        description: Exact 40-character commit SHA to build
        required: true
        type: string
      artifact_prefix:
        description: Prefix of the uploaded package artifacts
        required: true
        type: string
      testflight:
        description: Upload the iPhone build to TestFlight when App Store Connect secrets exist
        type: boolean
        default: false
    secrets:
      CAGE_ANDROID_DEV_KEYSTORE_BASE64:
        description: Base64 PKCS12 keystore for development APKs (optional)
        required: false
      CAGE_ANDROID_DEV_KEY_ALIAS:
        required: false
      CAGE_ANDROID_DEV_PASSWORD:
        required: false
      CAGE_ASC_KEY_P8:
        description: App Store Connect API private key (.p8) of the Admin role (optional)
        required: false
      CAGE_ASC_KEY_ID:
        required: false
      CAGE_ASC_ISSUER_ID:
        required: false
      CAGE_IOS_TEAM_ID:
        required: false
      CAGE_IOS_APP_ID:
        required: false
permissions:
  contents: read
jobs:
  android:
    # Development APK only. With the CAGE_ANDROID_DEV_* secrets it is signed by
    # a persistent CI development key, so later CI APKs update it in place.
    # Without them (forks, upstream) a key is generated for this run. Releases
    # keep using `mobile/build.sh android-release` with the release key.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CAGE_ANDROID_NDK: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Verify the immutable build revision
        env:
          CAGE_BUILD_REF: ${{ inputs.ref }}
        run: |
          [[ "$CAGE_BUILD_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Build ref must be a complete commit SHA.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "${CAGE_BUILD_REF,,}" ]] || { echo 'Checkout differs from the requested commit.' >&2; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/bindings/go.mod
          cache-dependency-path: mobile/bindings/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned Android SDK components
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0' "ndk;$CAGE_ANDROID_NDK" > /dev/null
          # gomobile otherwise picks whichever NDK the runner image has newest.
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$CAGE_ANDROID_NDK" >> "$GITHUB_ENV"
      - name: Prepare the CI development signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CAGE_ANDROID_DEV_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.CAGE_ANDROID_DEV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CAGE_ANDROID_DEV_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo '::notice::No CI development key configured; this APK uses a per-run key and cannot update other builds.'
            exit 0
          fi
          key="$RUNNER_TEMP/android-dev-signing"
          (umask 077; mkdir -p "$key"
           printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key/keystore.p12"
           printf '%s' "$KEY_PASSWORD" > "$key/password")
          {
            echo "CAGE_ANDROID_DEV_KEYSTORE=$key/keystore.p12"
            echo "CAGE_ANDROID_DEV_KEY_ALIAS=$KEY_ALIAS"
            echo "CAGE_ANDROID_DEV_PASSWORD_FILE=$key/password"
          } >> "$GITHUB_ENV"
      - name: Build the development APK
        run: |
          npm ci --prefix ui --no-audit --no-fund
          bash mobile/build.sh android
          version=$(tr -d '\r\n' < VERSION)
          out="$RUNNER_TEMP/mobile-android"
          mkdir -p "$out"
          apk="Cage-$version-${GITHUB_SHA::7}-android-arm64-debug.apk"
          cp mobile/.build/android/cage-mobile-debug.apk "$out/$apk"
          (cd "$out" && sha256sum "$apk" > "$apk.sha256")
          rm -rf "$RUNNER_TEMP/android-dev-signing"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-android-arm64
          path: ${{ runner.temp }}/mobile-android/
          if-no-files-found: error
          retention-days: 14
  ios:
    # Compile check without signing. With `testflight` and the CAGE_ASC_* /
    # CAGE_IOS_* secrets it instead archives with Apple cloud signing and
    # uploads to TestFlight (`mobile/build.sh ios-testflight TEAM_ID`).
    # From April 2027 App Store Connect accepts only uploads built with the
    # iOS 27 SDK or later (ITMS-90725). macos-26 ships only Xcode 26, so use
    # the xcode-27 image (macOS 27, Xcode 27 by default) until a macos-27 label
    # is generally available.
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: Require the iOS 27 SDK or later
        run: |
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $sdk"
          (( ${sdk%%.*} >= 27 )) || { echo "::error::App Store Connect requires the iOS 27 SDK or later, found $sdk." >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Verify the immutable build revision
        env:
          CAGE_BUILD_REF: ${{ inputs.ref }}
        run: |
          [[ "$CAGE_BUILD_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Build ref must be a complete commit SHA.' >&2; exit 1; }
          ref=$(printf '%s' "$CAGE_BUILD_REF" | tr '[:upper:]' '[:lower:]')
          [[ "$(git rev-parse HEAD)" == "$ref" ]] || { echo 'Checkout differs from the requested commit.' >&2; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/bindings/go.mod
          cache-dependency-path: mobile/bindings/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the iPhone app, and upload it to TestFlight when enabled
        env:
          TESTFLIGHT: ${{ inputs.testflight }}
          ASC_KEY_P8: ${{ secrets.CAGE_ASC_KEY_P8 }}
          CAGE_ASC_KEY_ID: ${{ secrets.CAGE_ASC_KEY_ID }}
          CAGE_ASC_ISSUER_ID: ${{ secrets.CAGE_ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.CAGE_IOS_TEAM_ID }}
          CAGE_IOS_APP_ID: ${{ secrets.CAGE_IOS_APP_ID }}
          # Unique and increasing for every run of the calling workflow.
          CAGE_IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npm ci --prefix ui --no-audit --no-fund
          if [[ "$TESTFLIGHT" == true && -n "$ASC_KEY_P8" && -n "$CAGE_ASC_KEY_ID" && -n "$CAGE_ASC_ISSUER_ID" && -n "$TEAM_ID" && -n "$CAGE_IOS_APP_ID" ]]; then
            key="$RUNNER_TEMP/asc"
            (umask 077; mkdir -p "$key"; printf '%s\n' "$ASC_KEY_P8" > "$key/AuthKey_$CAGE_ASC_KEY_ID.p8")
            export CAGE_ASC_KEY_PATH="$key/AuthKey_$CAGE_ASC_KEY_ID.p8"
            status=0
            bash mobile/build.sh ios-testflight "$TEAM_ID" || status=$?
            rm -rf "$key"
            exit "$status"
          fi
          if [[ "$TESTFLIGHT" == true ]]; then
            echo '::notice::App Store Connect secrets are not configured; only the unsigned compile check runs.'
          fi
          bash mobile/build.sh ios
          test -d mobile/.build/ios/products/Debug-iphoneos/CageMobile.app
